[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nanovlm-rsi"
version = "0.1.0"
description = "The simplest harness for multimodal recursive self-improvement research, in plain PyTorch."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Patrick Amadeus Irawan", email = "patrickai0309@gmail.com" }]
dependencies = ["torch", "numpy", "transformers>=4.50", "pillow", "safetensors"]

[project.urls]
Homepage = "https://github.com/patrickai0309/nanovlm-rsi"

[project.optional-dependencies]
craftax = ["jax", "craftax"]
bench = ["datasets"]
plot = ["matplotlib"]
wandb = ["wandb"]
dev = ["pytest", "matplotlib"]

[tool.setuptools]
py-modules = ["config", "rsi", "rollout", "evaluate", "play", "propose", "verify"]
packages = ["envs", "policy", "infra", "update", "evals", "tools"]

[tool.setuptools.package-data]
"*" = ["*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[project]
name = "nanovlm-rsi"
version = "0.1.0"
description = "The simplest harness for multimodal recursive self-improvement research."
requires-python = ">=3.12"
dependencies = ["torch", "numpy", "transformers", "pillow", "safetensors"]

[project.optional-dependencies]
craftax = ["jax", "craftax"]
bench = ["datasets"]
wandb = ["wandb"]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

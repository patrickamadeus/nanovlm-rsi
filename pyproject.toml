[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "picorsi"
version = "0.1.0"
description = "A small, readable stack for multimodal self-improvement loops, in plain PyTorch."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Patrick Amadeus Irawan", email = "patrickai0309@gmail.com" }]
dependencies = ["torch", "numpy", "transformers>=4.50", "pillow", "safetensors", "pyyaml"]

[project.urls]
Homepage = "https://github.com/patrickamadeus/picoRSI"

[project.optional-dependencies]
craftax = ["jax", "craftax"]
cauldron = ["pyarrow"]
eval = ["lmms-eval @ git+https://github.com/EvolvingLMMs-Lab/lmms-eval.git"]
plot = ["matplotlib"]
wandb = ["wandb"]
dev = ["pytest", "matplotlib"]

[tool.setuptools]
py-modules = ["train", "evaluate", "generate"]
packages = ["configs", "models", "envs", "rsi", "utils"]

[tool.setuptools.package-data]
configs = ["yaml/*.yaml", "openvlharness/*.yaml"]
utils = ["*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

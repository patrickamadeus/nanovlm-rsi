# ViSkill's sokoban setting with Qwen2.5-VL-3B (ViSkill's model). Plain GRPO on LoRA by default; the Phase 1
# matrix swaps methods on the command line, e.g. --methods viskill,grpo  or  --methods memory,grpo --skill_format text
env: sokoban
methods: [grpo]
planner: uniform
iters: 40
tasks_per_iter: 8
group_size: 8
eval_every: 10
eval_n: 200
gate_n: 32
grpo_lr: 3.0e-4                 # picked on FrozenLake: 7.5% -> 37.5% held-out by iteration 10 (1e-4: 33%)
run_dir: runs/sokoban_grpo
# skill settings from ViSkill: one card, shown only if close enough; only optimal-length successes are kept
mem_top_k: 1
mem_retrieve_alpha: 0.9
mem_retrieve_min: 0.8
mem_dedupe_sim: 0.9
mem_max_excess_steps: 0
policy:
  scaffold_path: utils/scaffold_agent.txt
  model_id: Qwen/Qwen2.5-VL-3B-Instruct
  max_new_tokens: 16

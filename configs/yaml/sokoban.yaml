# ViSkill's sokoban setting with Qwen2.5-VL-3B (ViSkill's model). Plain GRPO on LoRA by default; the Phase 1
# matrix swaps methods on the command line, e.g. --methods viskill,grpo  or  --methods memory,grpo --skill_format text
env: sokoban
methods: [grpo]
planner: uniform
iters: 40
tasks_per_iter: 8
group_size: 8
eval_every: 10
eval_n: 200
gate_n: 32
grpo_lr: 3.0e-4                 # picked on FrozenLake: 7.5% -> 37.5% held-out by iteration 10 (1e-4: 33%)
run_dir: runs/sokoban_grpo
gate_enabled: false            # as in VAGEN and sokoban_auto: the two differ only in planner + learning from failure
# How the policy answers: VAGEN's free_think format and settings (mll-lab-nu/VAGEN), prompt in prompts/sokoban.txt
answer_format: answer          # <think>...</think><answer>a1, a2</answer>
max_actions_per_turn: 3
max_turns: 5
format_reward: 0.1
wandb_project: picorsi
policy:
  prompt_path: prompts/sokoban.txt
  model_id: Qwen/Qwen2.5-VL-3B-Instruct
  response_prefix: ""
  stop_at_newline: false
  stop_strings: ["</answer>"]
  max_new_tokens: 512

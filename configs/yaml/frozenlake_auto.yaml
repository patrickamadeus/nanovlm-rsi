# The autonomous loop on frozenlake: the policy picks (or invents) its next level, GRPO learns from its attempts,
# and hindsight turns each failure into a success for the goal it did reach, which ReST then trains on.
# Nobody chooses tasks or labels anything after launch. No gate, as in VAGEN and SIMA 2: held-out eval reports.
# (ViSkill cards were dropped here: on FrozenLake they lowered success, 32.5% with vs 64% without, at 3B.)
env: frozenlake
methods: [hindsight, grpo, rest]
planner: voyager
iters: 40
tasks_per_iter: 8
group_size: 8
eval_every: 10
eval_n: 200
gate_n: 32
grpo_lr: 3.0e-4                 # picked on FrozenLake: 7.5% -> 37.5% held-out by iteration 10 (1e-4: 33%)
rest_lr: 1.0e-4                 # ReST on LoRA; the 1e-5 default is for full fine-tuning scale
run_dir: runs/frozenlake_auto
gate_enabled: false
# How the policy answers: VAGEN's free_think format and settings (mll-lab-nu/VAGEN), prompt in prompts/frozenlake.txt
answer_format: answer          # <think>...</think><answer>a1, a2</answer>
max_actions_per_turn: 5
max_turns: 5
format_reward: 0.02
wandb_project: picorsi
policy:
  prompt_path: prompts/frozenlake.txt
  model_id: Qwen/Qwen2.5-VL-3B-Instruct
  response_prefix: ""
  stop_at_newline: false
  stop_strings: ["</answer>"]
  max_new_tokens: 512
